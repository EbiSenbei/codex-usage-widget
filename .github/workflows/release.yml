name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\CodexUsageWidget\CodexUsageWidget.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match project version v$version."
          }

      - name: Build and test portable release
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = '.\artifacts\release\agent-usage-widget-win-x64.zip'
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  agent-usage-widget-win-x64.zip" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            .\artifacts\release\agent-usage-widget-win-x64.zip `
            .\artifacts\release\agent-usage-widget-win-x64.zip.sha256 `
            --verify-tag `
            --generate-notes `
            --title "Agent Usage Widget $env:RELEASE_TAG"
